baseURL = "https://cv.shamil.pro/"
title = "Shamil Sattarov CV"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

# Set here rather than passed as --minify, so a bare `hugo` cannot
# silently publish unminified output.
[minify]
  minifyOutput = true

[params]
  siteName = "Shamil Sattarov CV"
  releaseURL = "https://github.com/Bluesboy/Bluesboy/releases"
  # Both set by `make build/site`, through HUGO_PARAMS_VERSION and
  # HUGO_PARAMS_RESUMETAG. An empty resumeTag means no release exists yet,
  # and the Resume buttons fall back to releases/latest/download.
  version = ""
  resumeTag = ""

[languages]
  [languages.en]
    # Region-free: hreflang in the sitemap comes from this, and the CV
    # targets no single country. languageCode is deprecated since 0.158.
    locale = "en"
    label = "English"
    weight = 1
  [languages.ru]
    locale = "ru"
    label = "Русский"
    weight = 2
