name: Set up the build
description: >-
  Install every tool mise.toml pins, checked against mise.lock, and the
  Python packages requirements.txt locks. Shared by ci.yml and release.yml,
  so both build with the same tools.

runs:
  using: composite
  steps:
  - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      version: 2026.10.3
  - name: Install Python packages
    shell: bash
    run: make deps/install/python
