name: Set up the build
description: >-
  Install every tool mise.toml pins, checked against mise.lock, and the
  Python packages requirements.txt locks. Shared by ci.yml and release.yml,
  so both build with the same tools.

runs:
  using: composite
  steps:
  - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5  # v5.0.0
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      version: 2026.10.3
  - name: Install Python packages
    shell: bash
    run: make deps/install/python
