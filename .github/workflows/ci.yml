name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A superseded run tells us nothing; let the newest push cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        # This job never pushes.
        persist-credentials: false
    - uses: ./.github/actions/setup
    # Validates commit messages from the latest tag to HEAD. Every commit is
    # checked while it is new, so re-checking tagged history each run would
    # only add work that no longer has a fix short of a rewrite. cog.toml
    # ignores merge commits, so the synthetic merge GitHub builds for a pull
    # request cannot fail the check.
    - name: Check commit messages
      run: cog check --from-latest-tag
    - name: Build and test
      run: make ci

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: cv-preview
        path: |
          build/site
          build/pdf
        if-no-files-found: error
        retention-days: 7
