name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A superseded run tells us nothing; let the newest push cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        # This job never pushes.
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        # Only used to build actionlint; there is no go.mod to cache against.
        cache: false
    - uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.165.0'
        extended: true
    - uses: typst-community/setup-typst@v5
      with:
        typst-version: '0.15.1'
    # Installs cog and validates commit messages from the latest tag to HEAD.
    # Every commit is checked while it is new, so re-checking tagged history
    # each run would only add work that no longer has a fix short of a
    # rewrite. cog.toml ignores merge commits, so the synthetic merge GitHub
    # builds for a pull request cannot fail the check.
    # Pin v4.2.0, not v4: the moving tag still points at v4.0.0 and installs
    # cog 6.4.0, while v4.2.0 installs 7.0.0.
    - uses: cocogitto/cocogitto-action@v4.2.0
      with:
        command: check
        args: --from-latest-tag

    # typstyle and actionlint are built from source, which costs minutes on
    # every run. Cache the binaries themselves: `make deps/install` skips a
    # tool that is already on PATH, so a cache hit means no build at all.
    - id: tools
      run: echo "key=$(make -s deps/versions)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/typstyle
          ~/go/bin/actionlint
        key: lint-tools-${{ runner.os }}-${{ steps.tools.outputs.key }}

    - name: Install validators
      run: make deps/install
    - name: Build and test
      run: make ci

    - uses: actions/upload-artifact@v7
      with:
        name: cv-preview
        path: |
          build/site
          build/pdf
        if-no-files-found: error
        retention-days: 7
