name: Release and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Pages accepts one deployment at a time, and a half-finished one should
# not be cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  # Pages follows the PDFs: a push deploys only when its commits warrant a
  # release (feat, fix, or a breaking change), so the site never ships wording
  # the downloadable resume still contradicts. This job needs only git and
  # cog, so a push without a bump stops here instead of building for nothing.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      # A manual run deploys without a bump, to republish the current site.
      deploy: ${{ steps.plan.outputs.tag != '' || github.event_name == 'workflow_dispatch' }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: cocogitto/cocogitto-action@v4.2.0
      with:
        install-only: true
    # Predict the tag without creating it, so the build runs first and a
    # failed build cannot leave a tag behind.
    - id: plan
      run: echo "tag=$(make -s version/plan)" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        # Only used to build actionlint; there is no go.mod to cache against.
        cache: false
    - uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.165.0'
        extended: true
    # Pinned to a patch, unlike the other actions: upstream moves the v5 tag
    # onto prereleases, and it currently points at v5.3.0b1. Bump this by
    # hand once a stable v5.3.0 ships.
    - uses: typst-community/setup-typst@v5.2.0
      with:
        typst-version: '0.15.1'
    # Installs the cog binary only; version/release drives it from the
    # Makefile. Commit messages are validated in CI, where a
    # malformed one turns the check red instead of blocking a deployment.
    # install-only also skips the action's global git config, so the release
    # identity set below stays in force.
    - uses: cocogitto/cocogitto-action@v4.2.0
      with:
        install-only: true

    - id: tools
      run: echo "key=$(make -s deps/versions)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/typstyle
          ~/go/bin/actionlint
        key: lint-tools-${{ runner.os }}-${{ steps.tools.outputs.key }}
    - name: Install validators
      run: make deps/install

    - name: Build and test
      run: make ci ${TAG:+VERSION=$TAG}

    - name: Configure release identity
      if: env.TAG != ''
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    - name: Create version tag
      if: env.TAG != ''
      run: make --no-print-directory version/release
    - name: Publish GitHub Release
      if: env.TAG != ''
      env:
        GH_TOKEN: ${{ github.token }}
      run: make release VERSION="$TAG"

    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: build/site

  deploy:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
