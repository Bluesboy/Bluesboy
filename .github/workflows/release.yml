name: Release and deploy

# version.yml tags a commit once CI passes on it and starts this workflow
# for the tag; a tag pushed by hand starts it too. Running it again for an
# existing tag rebuilds and republishes that release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Pages accepts one deployment at a time, and a half-finished one should
# not be cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    # A manual run from a branch has no version to release; start it from a tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        # Publishing goes through gh and GH_TOKEN; git never pushes here.
        persist-credentials: false
    # Linting is skipped: it does not shape the artifacts, and CI already
    # linted the commit a release tag names. Build and tests still run,
    # since a tag pushed by hand has not been through CI.
    - uses: ./.github/actions/setup
    - name: Build and test
      run: make test/ci VERSION="$TAG"
    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: make release VERSION="$TAG"
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
      with:
        path: build/site

  deploy:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
