name: Release and deploy

# version.yml tags a commit once CI passes on it and starts this workflow
# for the tag; a tag pushed by hand starts it too. Running it again for an
# existing tag rebuilds and republishes that release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Pages accepts one deployment at a time, and a half-finished one should
# not be cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    # A manual run from a branch has no version to release; start it from a tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        # Only used to build actionlint; there is no go.mod to cache against.
        cache: false
    - uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.165.0'
        extended: true
    # Pinned to a patch, unlike the other actions: upstream moves the v5 tag
    # onto prereleases, and it currently points at v5.3.0b1. Bump this by
    # hand once a stable v5.3.0 ships.
    - uses: typst-community/setup-typst@v5.2.0
      with:
        typst-version: '0.15.1'

    - id: tools
      run: echo "key=$(make -s deps/versions)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/typstyle
          ~/go/bin/actionlint
        key: lint-tools-${{ runner.os }}-${{ steps.tools.outputs.key }}
    - name: Install validators
      run: make deps/install

    - name: Build and test
      run: make ci VERSION="$TAG"
    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: make release VERSION="$TAG"

    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: build/site

  deploy:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
