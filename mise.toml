# Every tool the build, its tests, linting and tagging need, pinned in one
# place for CI and local work alike. mise.lock records each download's
# checksum per platform; Renovate proposes the updates.
# Python packages are locked separately, in requirements*.txt.
[tools]
python = "3.13.15"
"aqua:gohugoio/hugo/hugo-extended" = "0.167.0"
"aqua:typst/typst" = "0.15.1"
"aqua:typstyle-rs/typstyle" = "0.15.1"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:cocogitto/cocogitto" = "7.0.0"
"aqua:astral-sh/uv" = "0.12.23"

[settings]
lockfile = true
# Refuse a tool whose download mise.lock does not record: a version bumped in
# this file without `mise lock` fails instead of installing unverified.
locked = true
