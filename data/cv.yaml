about:
- en: Migrate platforms from manually configured servers to cloud infrastructure. Completed three such migrations without downtime.
  ru: Переношу платформы с серверов, настроенных вручную, в облачную инфраструктуру. Выполнил три такие миграции без простоя.
- en: Manage applications and infrastructure through GitOps. Use Crossplane and Kubernetes operators to keep systems in the state described in Git.
  ru: Управляю приложениями и инфраструктурой через GitOps. Использую Crossplane и Kubernetes-операторы, чтобы поддерживать системы в состоянии, описанном в Git.
- en: Build and maintain infrastructure. Set up monitoring, disaster recovery, and secret rotation from the start.
  ru: Создаю и сопровождаю инфраструктуру. Сразу настраиваю мониторинг, аварийное восстановление и ротацию секретов.
- en: Enjoy sharing knowledge and helping colleagues simplify their work and automate routine tasks.
  ru: Люблю делиться знаниями и помогать коллегам упрощать работу и автоматизировать рутинные задачи.
- en: 'Know the Go, Java, Python, Node.js, .NET, and Rust ecosystems well from a build and release perspective: dependency management, packaging, and working with artifact repositories.'
  ru: 'Хорошо знаю экосистемы Go, Java, Python, Node.js, .NET и Rust со стороны сборки и выпуска приложений: управление зависимостями, пакетирование и работу с репозиториями артефактов.'
- en: 'Help teams adopt new processes and technologies and establish application development and release workflows: choose branching strategies, set up semantic versioning, automate releases, and apply twelve-factor principles.'
  ru: 'Помогаю командам осваивать новые процессы и технологии, налаживать разработку и выпуск приложений: выбирать стратегию ветвления, настраивать семантическое версионирование, автоматизировать релизы и применять принципы 12-факторных приложений.'
- en: 'Quickly understand unfamiliar systems, learn new technologies, and deploy services: from studying documentation and configuration to operation and troubleshooting.'
  ru: 'Быстро разбираюсь в незнакомых системах, осваиваю новые технологии и внедряю службы: от изучения документации и настройки до эксплуатации и устранения проблем.'
