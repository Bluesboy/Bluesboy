summary:
- en: "I specialize in production infrastructure on GCP/GKE: GitOps, IaC, CI/CD, observability, and stateful workloads. In moving systems from manual operations to declarative infrastructure, I have completed three zero-downtime migrations from manually configured servers to the cloud, introduced GitOps for 20+ services, and moved cloud resource management from Terraform to Crossplane. Working at the intersection of development and operations, I standardize delivery processes and reduce manual operational work for teams."
  ru: "Специализируюсь на production-инфраструктуре в GCP/GKE: GitOps, IaC, CI/CD, наблюдаемость и эксплуатация stateful-сервисов. Перевожу системы от ручного управления к декларативной модели: провёл три миграции с настроенных вручную серверов в облако без простоя, внедрил GitOps для 20+ сервисов и перевёл управление облачными ресурсами с Terraform на Crossplane. Работаю на стыке разработки и эксплуатации: стандартизирую процессы доставки и уменьшаю объём ручных операций для команд."

