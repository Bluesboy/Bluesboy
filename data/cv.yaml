about:
- en: Build infrastructure with monitoring, disaster recovery, and secret rotation in place from the start, not added later.
  ru: Строю инфраструктуру сразу с мониторингом, аварийным восстановлением и ротацией секретов, а не достраиваю их потом.
- en: "Know how applications in Go, Java, Python, Node.js, .NET, and Rust are built and released: dependency management, packaging, and artifact repositories."
  ru: "Знаю, как собираются и выпускаются приложения на Go, Java, Python, Node.js, .NET и Rust: управление зависимостями, пакетирование и репозитории артефактов."
- en: Share what I know and help teams adopt new processes and technologies. Set up development and release workflows - branching strategy, semantic versioning, automated releases, twelve-factor principles.
  ru: "Делюсь знаниями и помогаю командам осваивать новые процессы и технологии. Налаживаю разработку и выпуск приложений: стратегия ветвления, семантическое версионирование, автоматизация релизов, принципы 12-факторных приложений."
