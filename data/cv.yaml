about:
- en: Take platforms from hand-run servers to cloud-native operation — three such migrations, each completed without downtime.
  ru: Перевожу платформы с вручную настроенных серверов в cloud-native — три такие миграции, все без простоя.
- en: 'Work declaratively: GitOps for delivery, Crossplane for infrastructure, Kubernetes operators for stateful services, so the running state is what Git says it is.'
  ru: 'Работаю декларативно: GitOps для поставки, Crossplane для инфраструктуры, Kubernetes-операторы для stateful-сервисов — рабочее состояние совпадает с записанным в Git.'
- en: 'Run what I build: observability, disaster recovery and secrets rotation ship with the platform rather than after it.'
  ru: 'Эксплуатирую то, что строю: наблюдаемость, аварийное восстановление и ротация секретов появляются вместе с платформой, а не после неё.'
- en: Reach below the cluster when the problem is not in Kubernetes — routing and active network equipment, PKI and directory services, structured cabling.
  ru: 'Спускаюсь ниже кластера, когда проблема не в Kubernetes: маршрутизация и активное сетевое оборудование, PKI и службы каталогов, СКС.'
- en: Bring teams into these practices — infrastructure as code, Git-based workflows, CI/CD — instead of keeping them to myself.
  ru: Передаю практики команде — инфраструктура как код, работа через Git, CI/CD.
- en: Build and package other people's code across the Go, Java, Python, Node.js, .NET and Rust ecosystems — their dependency managers, artifact repositories and release layouts.
  ru: Собираю и пакетирую чужой код в экосистемах Go, Java, Python, Node.js, .NET и Rust — их менеджеры зависимостей, репозитории артефактов и раскладка релизов.
- en: 'Work inside the SDLC teams actually use: branching strategies including Gitflow, semantic versioning and automated releases, twelve-factor application design.'
  ru: 'Работаю внутри реального SDLC: стратегии ветвления, включая Gitflow, семантическое версионирование и автоматические релизы, приложения по методологии twelve-factor.'
