  Typst uses for the PDF), so web and PDF draw identical marks. Inlining
  these glyphs replaces two unsubsetted 596 KB OTFs, their preloads and
  their font-display:block blank period.

  Font Awesome draws inside y -64..448 in font units, so the outlines are
  flipped around the ascender rather than the em box; each viewBox is the

  label, so the glyph is aria-hidden and the label carries the meaning.
